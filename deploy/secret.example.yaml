# ВНИМАНИЕ: это шаблон. В репозиторий кладётся только запечатанный SealedSecret.
#   kubectl create secret generic citroen-postgres-credentials \
#     --namespace citroen --from-literal=username=car --from-literal=password='...' \
#     --dry-run=client -o yaml | kubeseal -o yaml > sealed-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: citroen-postgres-credentials
  namespace: citroen
type: kubernetes.io/basic-auth
stringData:
  username: car
  password: ЗАМЕНИ_МЕНЯ
